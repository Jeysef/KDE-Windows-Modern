<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Recent Files (also resolved for the Places panel, which picks
     actions/ first; identical to places/document-open-recent): a generic document with a clock badge, like the rest
     of the pack (white page from text-plain, Windows-style badge in the
     pack's blue). The dark folder this replaces clashed with the yellow
     folders around it. -->
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg5"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2" />
  <!-- page (from mimetypes/text-plain) -->
  <path
     id="page-outline"
     style="fill:#7d7d7b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"
     d="M 12,4 H 40.5 L 51.999999,15.5 V 60.000002 H 12 Z"
     sodipodi:nodetypes="cccccc" />
  <path
     id="page"
     style="fill:#fafafa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"
     d="M 13,5 V 59 H 51 V 17 H 40 c -0.554003,0 -1,-0.446 -1,-1 V 5 Z m 27,0 v 11 h 11 z"
     sodipodi:nodetypes="ccccsscccccc" />
  <path
     id="text-lines"
     style="fill:#999999;fill-opacity:1;stroke-width:2.89827;stroke-linecap:round;stroke-linejoin:round"
     d="m 18,24 v 1 h 20 v -1 z m 0,3 v 1 h 14 v -1 z m 0,3 v 1 h 26 v -1 z m 0,3 v 1 h 28 v -1 z m 0,3 v 1 h 24 v -1 z m 0,3 v 1 h 28 v -1 z m 0,3 v 1 h 18 v -1 z m 0,3 v 1 h 20 v -1 z"
     sodipodi:nodetypes="cccccccccccccccccccc" />
  <!-- clock badge -->
  <circle
     id="badge-keyline"
     style="fill:#ffffff"
     cx="46"
     cy="46"
     r="14" />
  <circle
     id="badge"
     style="fill:#0091e6"
     cx="46"
     cy="46"
     r="12" />
  <path
     id="badge-hands"
     style="fill:none;stroke:#ffffff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"
     d="M 46,46 V 38.6 M 46,46 h 6.4" />
</svg>
